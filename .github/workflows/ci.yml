name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  installers:
    name: Installer validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Shell syntax check
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh
          bash scripts/validate-opensips-sbc.sh
      - name: Engine log settings contract
        run: python3 tests/engine-logs.py && python3 tests/opensips-sbc-logs.py
